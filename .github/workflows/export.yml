name: Export Game

# This workflow exports the game for Windows and Linux when a new tag is pushed to the repository.
# To create a new tag and push it to the repository, run:
# git tag (version) && git push origin (version)
# Version should be in the format vX.Y.Z, for example v1.0.0

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: mygame

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      matrix:
        include:
          - preset: "Windows Desktop"
            dir: windows
            file: mygame.exe
          - preset: "Linux"
            dir: linux
            file: mygame.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --import || true

      - name: Export
        run: |
          mkdir -v -p build/${{ matrix.dir }}
          godot --headless --verbose --export-release "${{ matrix.preset }}" build/${{ matrix.dir }}/${{ matrix.file }}

      - name: Zip build
        run: |
          cd build/${{ matrix.dir }}
          zip -r ../../${{ env.EXPORT_NAME }}-${{ matrix.dir }}-${{ github.ref_name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-${{ matrix.dir }}
          path: ${{ env.EXPORT_NAME }}-${{ matrix.dir }}-${{ github.ref_name }}.zip

  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true